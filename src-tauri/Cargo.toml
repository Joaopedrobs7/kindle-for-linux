[package]
name = "kindle-linux"
version = "2.0.0"
description = "Kindle para Linux"
edition = "2021"
rust-version = "1.77"

[lib]
name = "kindle_linux_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2", features = [] }

[dependencies]
base64 = "0.22"
chrono = "0.4"
quick-xml = "0.37"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.2", features = ["unstable"] }
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
url = "2"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
lto = false
codegen-units = 1
